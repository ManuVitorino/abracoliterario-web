<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Abraço Literário - Home</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Topo -->
    <header class="header">
      <div class="user-section">
        <img src="perfil.jpg" alt="Foto de perfil" class="profile-pic" />
        <span class="welcome">Oi, Manu!</span>
        <div class="search-box">
          <input type="text" placeholder="Buscar livros..." />
          <button>🔍</button>
        </div>
      </div>

      <div class="logo">
        <!-- Colocar logo oficial depois -->
        <img src="logo.png" alt="Logo Abraço Literário" />
      </div>
    </header>

    <div class="container">
      <!-- Menu lateral -->
      <aside class="sidebar">
        <button>Histórico de Livros</button>
        <button>Avaliação de Livros</button>
        <button>Lista de Desejos</button>
      </aside>

      <!-- Grade de livros -->
      <main class="books-grid">
        <div class="book-card">
          <img
            src="../../../public/as vantagens de ser invisivel.png"
            alt="As vantagens de Ser Invisível"
          />
          <p>As vantagens de Ser Invisível</p>
        </div>
        <div class="book-card">
          <img
            src="../../../public/clara dos anjos.png"
            alt="Clara dos Anjos"
          />
          <p>Clara dos Anjos</p>
        </div>
        <div class="book-card">
          <img
            src="../../../public/os sete maridos de HG.png"
            alt="Os Sete Maridos de Evelyn Hugo"
          />
          <p>Os Sete Maridos de Evelyn Hugo</p>
        </div>
        <div class="book-card">
          <img
            src="../../../public/cancao para ninar menino grande.png"
            alt="Canção Para Ninar Menino Grande"
          />
          <p>Canção Para Ninar Menino Grande</p>
        </div>
        <div class="book-card">
          <img
            src="../../../public/Prisioneiro de Azkaban.png"
            alt="Prisioneiro de Azkaban"
          />
          <p>Prisioneiro de Azkaban</p>
        </div>
        <div class="book-card">
          <img
            src="../../../public/A Hora da Estrela.png"
            alt="A Hora da Estrela"
          />
          <p>A Hora da Estrela</p>
        </div>
        <div class="book-card">
          <img src="../../../public/Tudo é Rio.png" alt="Tudo é Rio" />
          <p>Tudo é Rio</p>
        </div>

        <div class="book-card">
          <img
            src="../../../public/Não é como nos Filmes.png"
            alt="Não é como Nos Filmes"
          />
          <p>Não é como Nos Filmes</p>
        </div>

        <div class="book-card">
          <img src="../../../public/helena.png" alt="Helena" />
          <p>Helena</p>
        </div>

        <div class="book-card">
          <img src="../../../public/Olhos D´gua.png" alt="Olhos D´gua" />
          <p>Olhos D´gua</p>
        </div>
      </main>
    </div>

    <!-- Rodapé -->
    <footer class="footer"></footer>
  </body>
</html>
